# Streamlit theme for the MarketShock dashboard.
# Kept in a config file so the base colours are applied before the app
# renders, which avoids a white flash on load.
[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#0a0f1c"
secondaryBackgroundColor = "#111a2e"
textColor = "#e8edf7"
